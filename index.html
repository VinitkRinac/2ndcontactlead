<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2nd Contact Tracker</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#14171c;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--accent-soft:#eef2ff;--ok:#059669;--warn:#d97706;--bad:#dc2626;--radius:12px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--surface:#16191e;--text:#eceef1;--muted:#8b93a1;--line:#262b33;--accent:#818cf8;--accent-soft:#1e2140;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.sp{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1200px;margin:auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{font-size:24px;display:block;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:12px}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.tools input{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .n{font-weight:600}
.card .m{color:var(--muted);font-size:12.5px}
.card .d{grid-column:1/-1;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;align-self:start}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.idle{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.due{color:var(--warn);font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;justify-content:flex-end;z-index:20}
.overlay.on{display:flex}
.panel{background:var(--surface);width:min(480px,100%);height:100%;overflow:auto;padding:22px;border-left:1px solid var(--line)}
.panel h2{margin:0 0 2px;font-size:18px}
.info{color:var(--muted);font-size:13px;margin-bottom:14px}
.info a{color:var(--accent);text-decoration:none}
.ctx{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px}
.ctx i{font-style:normal;color:var(--muted);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;font-weight:500}
.f input,.f select,.f textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.f input:focus,.f select:focus,.f textarea:focus,.tools input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.f textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;gap:8px;margin-top:18px}
.empty{text-align:center;color:var(--muted);padding:40px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
@media(min-width:800px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>2nd Contact Tracker<small>Stockist leads · saved automatically in this browser</small></h1>
  <div class="sp"></div>
  <span class="m" id="sync" style="color:var(--muted);font-size:12px"></span>
  <button class="btn" id="imp">Import</button>
  <button class="btn" id="expJ">Backup (JSON)</button>
  <button class="btn primary" id="expC">Export CSV</button>
  <button class="btn" id="out">Sign out</button>
  <input type="file" id="file" accept=".json" hidden>
</div></header>
<main>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search name, phone, state, notes…">
    <select id="fs"></select>
    <select id="fst"></select>
  </div>
  <div class="grid" id="list"></div>
</main>

<div class="overlay" id="ov"><div class="panel f" id="panel"></div></div>
<div class="overlay on" id="login" style="justify-content:center;align-items:center"><form class="panel f" id="lf" style="height:auto;width:min(380px,92%);border-radius:14px;border:1px solid var(--line)"><h2>2nd Contact Tracker</h2><div class="info">Sign in to view your leads</div><label>Email</label><input id="em" type="email" required autocomplete="username"><label>Password</label><input id="pw" type="password" required autocomplete="current-password"><div class="act"><button class="btn primary" style="width:100%" type="submit">Sign in</button></div><div class="info" id="lerr" style="color:var(--bad);margin:10px 0 0"></div></form></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'sb_publishable_EyZuRzoobUGjX7Ua7uE7IA_3Jmj6XlK';
const SUPABASE_KEY = 'sb_secret_vUD_UKHZSPdCoWRawGVCsg_8f079_Gy';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATUSES = [
  ['Not contacted','idle'],['Interested','ok'],['Meeting scheduled','ok'],['Needs follow-up','warn'],
  ['Not reachable','warn'],['Converted','ok'],['Not interested','bad']
];
const MODES = ['Phone call','WhatsApp','Email','Video call','In person'];
const FIELDS = ['status','contactDate','mode','outcome','investment','nextDate','notes'];


let LEADS = [], store = {}, sb = null, channel = null;
const rec = id => (store[id] && store[id].status) ? store[id] : { status:'Not contacted' };
const cls = s => (STATUSES.find(x => x[0] === s) || [,'idle'])[1];
const today = () => new Date().toISOString().slice(0,10);
const fmt = d => d ? new Date(d + 'T00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2000); }
const setSync = m => $('#sync').textContent = m;
// filters
function buildStates(){ const states = [...new Set(LEADS.map(l => l.state).filter(Boolean))].sort(); $('#fs').innerHTML = '<option value="">All states</option>' + states.map(s => `<option>${esc(s)}</option>`).join(''); }
$('#fst').innerHTML = '<option value="">All statuses</option>' + STATUSES.map(s => `<option>${s[0]}</option>`).join('');
['#q','#fs','#fst'].forEach(s => $(s).addEventListener('input', render));

function render(){
  const q = $('#q').value.toLowerCase(), fs = $('#fs').value, fst = $('#fst').value;
  const done = LEADS.filter(l => rec(l.id).status !== 'Not contacted').length;
  const count = n => LEADS.filter(l => rec(l.id).status === n).length;
  const due = LEADS.filter(l => rec(l.id).nextDate && rec(l.id).nextDate <= today()).length;
  $('#stats').innerHTML = [
    [LEADS.length,'Total leads'],[done,'2nd contact done'],[LEADS.length-done,'Pending'],
    [count('Interested')+count('Meeting scheduled'),'Interested'],[count('Converted'),'Converted'],[due,'Follow-ups due']
  ].map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

  const rows = LEADS.filter(l => {
    const r = rec(l.id);
    if (fs && l.state !== fs) return false;
    if (fst && r.status !== fst) return false;
    return !q || [l.name,l.phone,l.email,l.state,l.id,l.desc,r.notes,r.outcome].join(' ').toLowerCase().includes(q);
  });
  $('#list').innerHTML = rows.length ? rows.map(l => {
    const r = rec(l.id), overdue = r.nextDate && r.nextDate <= today();
    return `<div class="card" data-id="${l.id}">
      <div><div class="n">${esc(l.name)}</div><div class="m">${l.id} · ${esc(l.state)} · +${esc(l.phone)}</div></div>
      <span class="pill ${cls(r.status)}">${r.status}</span>
      <div class="d">${esc(r.outcome || l.desc)}</div>
      ${r.nextDate ? `<div class="m ${overdue?'due':''}">Next follow-up: ${fmt(r.nextDate)}</div>` : ''}
    </div>`;
  }).join('') : '<div class="empty">No leads match your filters.</div>';
}

$('#list').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) open(c.dataset.id); });

function open(id){
  const l = LEADS.find(x => x.id === id), r = rec(id);
  $('#panel').innerHTML = `
    <h2>${esc(l.name)}</h2>
    <div class="info">${l.id} · ${esc(l.state)} · ${esc(l.campaign)}<br>
      <a href="tel:+${l.phone}">+${esc(l.phone)}</a> · <a href="https://wa.me/${l.phone}" target="_blank" rel="noopener">WhatsApp</a>
      ${l.email ? ` · <a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : ''}</div>
    <div class="ctx"><i>1st contact notes · by ${esc(l.ecs)}</i>${esc(l.desc) || '—'}</div>
    <label>Status</label>
    <select id="status">${STATUSES.map(s => `<option ${s[0]===r.status?'selected':''}>${s[0]}</option>`).join('')}</select>
    <div class="row">
      <div><label>2nd contact date</label><input type="date" id="contactDate" value="${r.contactDate || today()}"></div>
      <div><label>Mode</label><select id="mode">${MODES.map(m => `<option ${m===r.mode?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <label>Outcome (short summary)</label>
    <input id="outcome" value="${esc(r.outcome)}" placeholder="e.g. Wants pricing sheet, will decide this week">
    <div class="row">
      <div><label>Investment capacity</label><input id="investment" value="${esc(r.investment)}" placeholder="e.g. ₹5 lakh"></div>
      <div><label>Next follow-up</label><input type="date" id="nextDate" value="${r.nextDate || ''}"></div>
    </div>
    <label>Detailed notes</label>
    <textarea id="notes" placeholder="What was discussed, objections, requirements, next steps…">${esc(r.notes)}</textarea>
    <div class="act">
      <button class="btn primary" id="sv">Save</button>
      <button class="btn" id="cl">Close</button>
      <div class="sp"></div>
      <button class="btn" id="rs">Clear</button>
    </div>`;
  $('#ov').classList.add('on');
  $('#cl').onclick = close;
  $('#sv').onclick = () => {
    const o = {}; FIELDS.forEach(f => o[f] = $('#' + f).value.trim());
    o.updated = new Date().toISOString();
    persist(id, o).then(ok => { if (ok) { close(); toast('Saved & synced'); } });
  };
  $('#rs').onclick = () => { if (confirm('Clear all saved details for this lead?')) persist(id, {}).then(ok => { if (ok) close(); }); };
}
function close(){ $('#ov').classList.remove('on'); }
$('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });


async function persist(id, details){
  setSync('Saving…');
  const { error } = await sb.from('leads').update({ details, updated_at: new Date().toISOString() }).eq('id', id);
  if (error) { setSync('Not saved'); toast('Save failed: ' + error.message); return false; }
  store[id] = details; render(); setSync('Synced'); return true;
}
async function load(){
  setSync('Loading…');
  const { data, error } = await sb.from('leads').select('*').order('id');
  if (error) { setSync('Error'); toast(error.message); return; }
  LEADS = data.map(r => ({ id: r.id, ...r.info }));
  store = Object.fromEntries(data.map(r => [r.id, r.details || {}]));
  buildStates(); render(); setSync('Synced');
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('leads-live').on('postgres_changes', { event:'UPDATE', schema:'public', table:'leads' }, p => {
    store[p.new.id] = p.new.details || {}; render(); setSync('Synced · updated just now');
  }).subscribe();
}

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$('#expJ').onclick = () => download(`second-contact-backup-${today()}.json`, JSON.stringify(store, null, 2), 'application/json');
$('#expC').onclick = () => {
  const head = ['Lead ID','Name','Phone','Email','State','Status','2nd Contact Date','Mode','Outcome','Investment','Next Follow-up','Notes'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = LEADS.map(l => { const r = rec(l.id);
    return [l.id,l.name,l.phone,l.email,l.state,r.status,r.contactDate,r.mode,r.outcome,r.investment,r.nextDate,r.notes].map(q).join(','); });
  download(`second-contact-${today()}.csv`, '\ufeff' + [head.map(q).join(','), ...lines].join('\n'), 'text/csv');
};
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const d = JSON.parse(rd.result); if (typeof d !== 'object' || Array.isArray(d)) throw 0;
      const ids = Object.keys(d).filter(id => LEADS.some(l => l.id === id));
      await Promise.all(ids.map(id => persist(id, d[id])));
      toast('Backup imported');
    } catch(_) { toast('Invalid backup file'); }
  };
  rd.readAsText(f); e.target.value = '';
};

// auth
function showApp(on){ $('#login').classList.toggle('on', !on); }
$('#lf').onsubmit = async e => {
  e.preventDefault(); $('#lerr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  if (error) $('#lerr').textContent = error.message;
};
$('#out').onclick = () => sb.auth.signOut();

if (SUPABASE_URL.startsWith('YOUR_')) {
  $('#lerr').textContent = 'Setup needed: add your Supabase URL and anon key at the top of the script.';
} else {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((_ev, session) => {
    if (session) { showApp(true); load(); }
    else { showApp(false); LEADS = []; store = {}; $('#list').innerHTML = ''; $('#stats').innerHTML = ''; setSync(''); }
  });
}
</script>
</body>
</html>
